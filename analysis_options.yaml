include: package:very_good_analysis/analysis_options.11.0.0.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    # Generated by flutter gen-l10n from the locale resources.
    - lib/app/localization/*.dart

linter:
  rules:
    # Direct internal imports and module entry points are checked by
    # tool/check_architecture.dart instead of either blanket import rule.
    always_use_package_imports: false
    prefer_relative_imports: false
