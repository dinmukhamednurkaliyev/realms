[assets]
directory = "assets"
entry_point = "lib/app/asset/asset.dart"
output = "lib/app/asset/catalog.dart"
exclude = ["localization/**"]

[localization]
directory = "assets/localization"
layout = "module/locale"
locales = ["en", "ru"]
fallback = "en"
entry_point = "lib/app/localization/localization.dart"
output = "lib/app/localization/messages.dart"
