
# Development Tools

[tools]
flutter = "3.47.7"
java = "21.0.2"
typos = "1.51.1"


# Dependencies

[tasks."dependencies:install"]
description = "Install project dependencies"
run = "flutter pub get"

[tasks."dependencies:verify"]
description = "Restore dependencies from the lockfile"
run = "flutter pub get --enforce-lockfile"

[tasks."dependencies:outdated"]
description = "Show outdated project dependencies"
run = "flutter pub outdated"

[tasks."dependencies:sort"]
description = "Sort dependencies in all pubspec files"
run = [
  "dart run dependency_sorter",
  "dart run dependency_sorter --path packages/engine",
]

[tasks."dependencies:check-order"]
description = "Check dependency ordering in all pubspec files"
run = [
  "dart run dependency_sorter --check",
  "dart run dependency_sorter --check --path packages/engine",
]


# Formatting

[tasks."format:check"]
description = "Check Dart formatting without modifying files"
run = "dart format --output=none --set-exit-if-changed ."

[tasks."format:apply"]
description = "Format all Dart source files"
run = "dart format ."


# Static Analysis

[tasks.analyze]
description = "Analyze application and game engine"
run = [{ task = "analyze:application" }, { task = "analyze:engine" }]

[tasks."analyze:application"]
description = "Analyze Flutter application"
run = "flutter analyze --fatal-infos"

[tasks."analyze:engine"]
description = "Analyze game engine"
dir = "packages/engine"
run = "dart analyze --fatal-infos"


# Spelling

[tasks."spelling:check"]
description = "Check spelling in project files"
run = "typos ."


# Testing

[tasks.test]
description = "Run all project tests"
run = [{ task = "test:engine" }]

[tasks."test:engine"]
description = "Run game engine tests"
dir = "packages/engine"
run = "dart test"


# Automatic Fixes

[tasks.fix]
description = "Apply automatic fixes to the entire project"
run = [
  { task = "fix:application" },
  { task = "fix:engine" },
  { task = "dependencies:sort" },
  { task = "format:apply" },
]

[tasks."fix:application"]
description = "Apply automatic fixes to Flutter application"
run = "dart fix --apply"

[tasks."fix:engine"]
description = "Apply automatic fixes to game engine"
dir = "packages/engine"
run = "dart fix --apply"


# Quality Verification

[tasks.verify]
description = "Run all project quality checks"
run = [
  { task = "format:check" },
  { task = "dependencies:check-order" },
  { task = "analyze" },
  { task = "spelling:check" },
  { task = "test" },
]


# Development

[tasks."run:web"]
description = "Run Flutter application using a local web server"
run = "flutter run -d web-server"
interactive = true


# Web Builds

[tasks."build:web"]
description = "Build the production web application"
run = "flutter build web --release"


# Android Builds

[tasks."build:android:debug"]
description = "Build the Android debug application"
run = "flutter build apk --debug"

[tasks."build:android:bundle"]
description = "Build the Android release application bundle"
run = "flutter build appbundle --release"


# Maintenance

[tasks.clean]
description = "Remove generated Flutter build artifacts"
run = "flutter clean"
