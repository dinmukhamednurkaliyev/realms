[tools]
flutter = "3.47.7"
java = "21.0.2"
typos = "1.51.1"

[tasks."dependencies:install"]
description = "Install Flutter project dependencies"
run = "flutter pub get"

[tasks."dependencies:outdated"]
description = "Show outdated Flutter dependencies"
run = "flutter pub outdated"

[tasks."dependencies:verify"]
description = "Install and verify locked Flutter dependencies"
run = "flutter pub get --enforce-lockfile"

[tasks."format:check"]
description = "Check Dart formatting without modifying files"
run = "dart format --output=none --set-exit-if-changed ."

[tasks."format:apply"]
description = "Apply Dart formatting to source files"
run = "dart format ."

[tasks.analyze]
description = "Analyze Dart source code"
run = "flutter analyze --fatal-infos"

[tasks."spelling:check"]
description = "Check spelling in project files"
run = "typos ."

[tasks.test]
description = "Run Flutter tests"
run = "flutter test"

[tasks.verify]
description = "Run all project quality checks"
run = [
  { task = "format:check" },
  { task = "analyze" },
  { task = "spelling:check" },
]

[tasks."run:web"]
description = "Run the Flutter application using a local web server"
run = "flutter run -d web-server"
interactive = true

[tasks."build:web"]
description = "Build the production web application"
run = "flutter build web --release"

[tasks."build:android:debug"]
description = "Build a debug Android application package"
run = "flutter build apk --debug"

[tasks."build:android:bundle"]
description = "Build an Android App Bundle"
run = "flutter build appbundle --release"

[tasks.clean]
description = "Remove generated Flutter build artifacts"
run = "flutter clean"
