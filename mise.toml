
# Development Tools

[tools]
flutter = "3.47.8"
java = "21.0.2"
typos = "1.51.1"


# Dependencies

[tasks."dependencies:install"]
description = "Install project dependencies"
run = "flutter pub get"

[tasks."dependencies:verify"]
description = "Restore dependencies from the lockfile"
run = "flutter pub get --enforce-lockfile"

[tasks."dependencies:outdated"]
description = "Show outdated project dependencies"
run = "flutter pub outdated"

[tasks."dependencies:sort"]
description = "Sort application dependencies"
run = 'FLUTTER_ROOT="$(mise where flutter)" dart run dependency_sorter'

[tasks."dependencies:check-order"]
description = "Check application dependency ordering"
run = 'FLUTTER_ROOT="$(mise where flutter)" dart run dependency_sorter --check'


# Formatting

[tasks."format:check"]
description = "Check Dart formatting without modifying files"
run = "dart format --output=none --set-exit-if-changed ."

[tasks."format:apply"]
description = "Format all Dart source files"
run = "dart format ."


# Static Analysis

[tasks.analyze]
description = "Analyze the complete Flutter application"
run = "flutter analyze --fatal-infos"


# Spelling

[tasks."spelling:check"]
description = "Check spelling in project files"
run = "typos ."


# Testing

[tasks.test]
description = "Run all project tests"
run = "flutter test"


# Automatic Fixes

[tasks.fix]
description = "Apply automatic fixes to the entire project"
run = [
  "dart fix --apply",
  { task = "dependencies:sort" },
  { task = "format:apply" },
]


# Quality Verification

[tasks.verify]
description = "Run all project quality checks"
run = [
  { task = "format:check" },
  { task = "dependencies:check-order" },
  { task = "analyze" },
  { task = "spelling:check" },
  { task = "test" },
]


# Development

[tasks."run:web"]
description = "Run Flutter application using a local web server"
run = "flutter run -d web-server"
interactive = true


# Web Builds

[tasks."build:web"]
description = "Build the production web application"
run = "flutter build web --release"


# Android Builds

[tasks."build:android:debug"]
description = "Build the Android debug application"
run = "flutter build apk --debug"

[tasks."build:android:bundle"]
description = "Build the Android release application bundle"
run = "flutter build appbundle --release"


# Maintenance

[tasks.clean]
description = "Remove generated Flutter build artifacts"
run = "flutter clean"
